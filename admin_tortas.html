<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Pastelería - Panadería Belén</title>
    <link rel="icon" href="imagen/logo.jpg">
    <link rel="apple-touch-icon" href="imagen/logo.jpg">
    <link rel="icon" sizes="192x192" href="imagen/logo.jpg">
    <link rel="icon" sizes="512x512" href="imagen/logo.jpg">
    <meta name="theme-color" content="#ef6c00">
    
    <link rel="stylesheet" href="style.css">
    <style>
        #panel-admin { display: none; } 
        .login-box { max-width: 350px; margin: 50px auto; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .login-box input { width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px; }
        .btn-logout { background: #333; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .btn-logout:hover { background: #555; }
    </style>
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; flex-wrap: wrap; gap: 10px;">
        <div class="header-text" style="text-align: left;">
            <h1>Administración Pastelería</h1>
            <p>Gestión de Tortas, Kuchen y Stock</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <a href="tortas.html" style="background: white; color: var(--primary); text-decoration: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; border: 2px solid white; transition: 0.2s;">Ver como Cliente</a>
            
            <button id="btn-logout" class="btn-logout" style="display:none;">Cerrar Sesión</button>
        </div>
    </header>

    <div class="container">
        <div id="login-section" class="login-box">
            <h2 style="color: var(--primary); margin-top: 0;">Iniciar Sesión</h2>
            <input type="email" id="login-email" placeholder="Correo electrónico" required>
            <input type="password" id="login-pass" placeholder="Contraseña" required>
            <button id="btn-login">Ingresar</button>
            <p id="login-error" style="color: red; display: none; margin-top: 15px; font-size: 0.9em; font-weight: bold;">Error: Credenciales incorrectas.</p>
        </div>

        <div id="panel-admin">
            <div style="background: #fff3e0; padding: 25px; margin-bottom: 30px; border-radius: 10px; border: 2px dashed #ffb74d;">
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                    <h2 style="color: #ef6c00; margin: 0;">🍰 Nuevo Producto de Pastelería</h2>
<a href="admin.html" style="background: #ff9800; color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">🍞 Ir a Panadería</a>                </div>

                <form id="form-producto" style="display: flex; flex-wrap: wrap; gap: 10px;">
                    <input type="text" id="prod-nombre" placeholder="Nombre (ej: Torta Tres Leches)" required style="padding: 10px; flex: 1; min-width: 200px; border: 1px solid #ccc; border-radius: 5px;">
                    <input type="text" id="prod-precio" placeholder="Precio (ej: $15000)" required style="padding: 10px; flex: 1; min-width: 100px; border: 1px solid #ccc; border-radius: 5px;">
                    <input type="number" id="prod-stock" placeholder="Stock disponible (ej: 5)" required style="padding: 10px; flex: 1; min-width: 100px; border: 1px solid #ccc; border-radius: 5px;">
                    <input type="text" id="prod-desc" placeholder="Descripción breve" required style="padding: 10px; flex: 1; min-width: 200px; border: 1px solid #ccc; border-radius: 5px;">
                    
                    <select id="prod-categoria" required style="padding: 10px; flex: 1; min-width: 150px; border: 1px solid #ccc; border-radius: 5px;">
                        <option value="">Selecciona Categoría...</option>
                        <option value="TORTAS">TORTAS</option>
                        <option value="KUCHEN">KUCHEN</option>
                        <option value="EMPANADAS">EMPANADAS</option>
                        <option value="COSAS DULCES">COSAS DULCES</option>
                        <option value="FRUTERIA">FRUTERIA</option>
                    </select>

                    <div style="flex: 1; min-width: 100%; background: white; padding: 15px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box;">
                        <p style="margin: 0 0 10px 0; font-size: 14px; color: #555; font-weight: bold;">📸 Foto del producto:</p>
                        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                            <div style="flex: 1; min-width: 200px;">
                                <label style="font-size: 12px; color: #777;">Opción 1: Cámara o Galería</label>
                                <input type="file" id="prod-img-file" accept="image/*" capture="environment" style="width: 100%; padding: 5px; box-sizing: border-box;">
                            </div>
                            <div style="flex: 1; min-width: 200px;">
                                <label style="font-size: 12px; color: #777;">Opción 2: Pegar Link URL</label>
                                <input type="url" id="prod-img-url" placeholder="https://..." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                            </div>
                        </div>
                    </div>

                    <button id="btn-guardar-form" type="submit" style="background: #ef6c00; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px; min-width: 150px;">Guardar / Actualizar Stock</button>
                    <button type="button" id="btn-cancelar-edicion" style="display: none; background: #999; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px;">Cancelar Edición</button>
                </form>
            </div>

            <div id="categorias-container">
                <h2 class="section-title">TORTAS</h2>
                <div class="product-grid" id="grid-tortas"></div>
                <h2 class="section-title">KUCHEN</h2>
                <div class="product-grid" id="grid-kuchen"></div>
                <h2 class="section-title">EMPANADAS</h2>
                <div class="product-grid" id="grid-empanadas"></div>
                <h2 class="section-title">COSAS DULCES</h2>
                <div class="product-grid" id="grid-cosas-dulces"></div>
                <h2 class="section-title">FRUTERIA</h2>
                <div class="product-grid" id="grid-fruteria"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfle8tRTuz_33Su2H8fTwjUywRN5VKU7Q",
            authDomain: "panaderia-belen.firebaseapp.com",
            projectId: "panaderia-belen",
            storageBucket: "panaderia-belen.firebasestorage.app",
            messagingSenderId: "982156401466",
            appId: "1:982156401466:web:4b8167ae3b676f8b3ece03"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const loginSection = document.getElementById('login-section');
        const panelAdmin = document.getElementById('panel-admin');
        const btnLogout = document.getElementById('btn-logout');
        const msjError = document.getElementById('login-error');
        
        const formulario = document.getElementById('form-producto');
        const btnGuardarForm = document.getElementById('btn-guardar-form');
        const btnCancelarEdicion = document.getElementById('btn-cancelar-edicion');
        
        let idProductoEditando = null;
        let urlImagenActual = ""; 

        // --- AUTENTICACIÓN ---
        document.getElementById('btn-login').addEventListener('click', () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(() => {
                msjError.style.display = 'block';
            });
        });

        btnLogout.addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = 'none';
                panelAdmin.style.display = 'block';
                btnLogout.style.display = 'block';
                cargarPasteleriaAdmin(); 
            } else {
                loginSection.style.display = 'block';
                panelAdmin.style.display = 'none';
                btnLogout.style.display = 'none';
                msjError.style.display = 'none';
            }
        });

 // --- NUEVO SISTEMA: IMGBB GRATIS Y RÁPIDO ---
        async function subirFotoAImgBB(archivoOPureBase64) {
            const formData = new FormData();
            formData.append("image", archivoOPureBase64);
            const apiKey = "dfe3b16bcee1c9785e2aef03245ec113"; 
            const url = `https://api.imgbb.com/1/upload?key=${apiKey}`;
            const respuesta = await fetch(url, { method: "POST", body: formData });
            const datos = await respuesta.json();
            return datos.data.url; 
        }

        // --- CRUD ---
        function resetearFormulario() {
            formulario.reset();
            idProductoEditando = null;
            urlImagenActual = "";
            btnGuardarForm.innerText = "Guardar / Actualizar Stock";
            btnGuardarForm.style.background = "#ef6c00";
            btnCancelarEdicion.style.display = 'none';
        }

        btnCancelarEdicion.addEventListener('click', resetearFormulario);

        formulario.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnGuardarForm.disabled = true;
            btnGuardarForm.innerText = "Subiendo imagen... ⏳";

            try {
                let urlImagenFinal = urlImagenActual; 
                const archivoFoto = document.getElementById('prod-img-file').files[0];
                const urlTexto = document.getElementById('prod-img-url').value.trim();

                if (archivoFoto) urlImagenFinal = await subirFotoAImgBB(archivoFoto);
                else if (urlTexto !== "") urlImagenFinal = urlTexto;

                btnGuardarForm.innerText = "Guardando... 💾";

                const datosProducto = {
                    nombre: document.getElementById('prod-nombre').value,
                    precio: document.getElementById('prod-precio').value,
                    descripcion: document.getElementById('prod-desc').value,
                    stock: document.getElementById('prod-stock').value,
                    imagen: urlImagenFinal, 
                    categoria: document.getElementById('prod-categoria').value
                };

                if (idProductoEditando) {
                    await updateDoc(doc(db, "productos", idProductoEditando), datosProducto);
                } else {
                    await addDoc(collection(db, "productos"), datosProducto);
                }
                
                resetearFormulario();
                cargarPasteleriaAdmin(); 
            } catch (error) {
                alert("❌ Hubo un error.");
            } finally {
                btnGuardarForm.disabled = false;
                btnGuardarForm.innerText = "Guardar / Actualizar Stock";
            }
        });
        // --- CARGAR PASTELERIA ---
        // --- CARGAR PASTELERIA ---
        async function cargarPasteleriaAdmin() {
            document.getElementById('grid-tortas').innerHTML = '';
            document.getElementById('grid-kuchen').innerHTML = '';
            document.getElementById('grid-empanadas').innerHTML = '';
            document.getElementById('grid-cosas-dulces').innerHTML = '';
            document.getElementById('grid-fruteria').innerHTML = '';
            
            const querySnapshot = await getDocs(collection(db, "productos"));
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                
                const categoriasValidas = ["TORTAS", "KUCHEN", "EMPANADAS", "COSAS DULCES", "FRUTERIA"];
                
                if(categoriasValidas.includes(data.categoria)) {
                    let contenedorGrilla = null;
                    if(data.categoria === "TORTAS") contenedorGrilla = document.getElementById('grid-tortas');
                    if(data.categoria === "KUCHEN") contenedorGrilla = document.getElementById('grid-kuchen');
                    if(data.categoria === "EMPANADAS") contenedorGrilla = document.getElementById('grid-empanadas');
                    if(data.categoria === "COSAS DULCES") contenedorGrilla = document.getElementById('grid-cosas-dulces');
                    if(data.categoria === "FRUTERIA") contenedorGrilla = document.getElementById('grid-fruteria');

                    if(contenedorGrilla) {
                        const tarjeta = document.createElement('div');
                        tarjeta.className = 'product-card';
                        tarjeta.innerHTML = `
                            <img src="${data.imagen}" alt="${data.nombre}" >
                            <div class="info">
                                <h3>${data.nombre}</h3>
                                <p class="price">${data.precio}</p>
                                <p style="color: #2e7d32; font-weight: bold; margin: 5px 0; font-size: 14px;">Stock: ${data.stock || 'Sin definir'}</p>
                                <div style="display: flex; gap: 5px; margin-top: 10px;">
                                    <button class="btn-editar" style="background: #2196F3; color: white; border: none; padding: 6px; border-radius: 5px; cursor: pointer; flex: 1; font-weight: bold;">Editar</button>
                                    <button class="btn-eliminar" style="background: #f44336; color: white; border: none; padding: 6px; border-radius: 5px; cursor: pointer; flex: 1; font-weight: bold;">Borrar</button>
                                </div>
                            </div>
                        `;

                        tarjeta.querySelector('.btn-eliminar').addEventListener('click', async () => {
                            if(confirm(`⚠️ ¿Deseas eliminar "${data.nombre}"?`)) {
                                await deleteDoc(doc(db, "productos", docSnap.id));
                                cargarPasteleriaAdmin();
                            }
                        });

                        tarjeta.querySelector('.btn-editar').addEventListener('click', () => {
                            document.getElementById('prod-nombre').value = data.nombre;
                            document.getElementById('prod-precio').value = data.precio;
                            document.getElementById('prod-stock').value = data.stock || '';
                            document.getElementById('prod-desc').value = data.descripcion || '';
                            document.getElementById('prod-categoria').value = data.categoria;
                            
                            urlImagenActual = data.imagen; 
                            document.getElementById('prod-img-file').value = ''; 
                            if(data.imagen && !data.imagen.startsWith('data:image')) document.getElementById('prod-img-url').value = data.imagen; 
                            else document.getElementById('prod-img-url').value = '';
                            
                            idProductoEditando = docSnap.id;
                            btnGuardarForm.innerText = "🔄 Actualizar Producto";
                            btnGuardarForm.style.background = "#2196F3";
                            btnCancelarEdicion.style.display = 'block';
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        });

                        contenedorGrilla.prepend(tarjeta);
                    }
                }
            });
        }
    </script>
</body>
</html>
