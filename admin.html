<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Administración - Panadería Belén</title>
    <link rel="preconnect" href="https://wsrv.nl" crossorigin>
    <link rel="preconnect" href="https://i.ibb.co" crossorigin>
    <link rel="dns-prefetch" href="https://i.ibb.co">
    <link rel="preconnect" href="https://api.imgbb.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

    <!-- Íconos para iPhone (iOS) y Android + PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="imagen/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="imagen/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="imagen/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Panadería Belén">
    <meta name="application-name" content="Panadería Belén">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ef6c00">

    <link rel="stylesheet" href="style.css">
    <style>
        #panel-admin { display: none; }
        .login-box { max-width: 380px; margin: 40px auto; padding: 30px 24px; background: white; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; border: 1px solid #f2e9df; }
        .login-box input { width: 100%; margin-bottom: 15px; padding: 13px 15px; box-sizing: border-box; border: 1.5px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; }
        .login-box input:focus { border-color: var(--accent); }
        .login-box button { width: 100%; padding: 13px; background: linear-gradient(135deg, #ff9800, #ef6c00); color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 10px; font-size: 16px; transition: 0.2s; }
        .login-box button:hover { opacity: 0.95; }
        .btn-logout { background: #2d2420; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 10px; font-weight: bold; font-size: 0.9rem; }
        .btn-logout:hover { background: #4e342e; }
        .admin-card { padding: 22px; margin-bottom: 24px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
        .admin-input { padding: 12px 14px; flex: 1; min-width: 180px; border: 1.5px solid #d7ccc8; border-radius: 10px; font-size: 16px; outline: none; background: white; }
        .admin-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(239, 108, 0, 0.15); }
        .img-preview-box { display: none; align-items: center; gap: 12px; margin-top: 12px; padding: 10px 14px; background: white; border-radius: 10px; border: 1.5px solid #ffcc80; }
        .img-preview-box img { width: 62px; height: 62px; object-fit: cover; border-radius: 8px; }
        @media (max-width: 600px) {
            .admin-card { padding: 16px; }
            .admin-input { min-width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-brand">
            <img src="imagen/apple-touch-icon.png" alt="Logo Belén" class="logo-header">
            <div class="header-text">
                <h1>Panel de Administración</h1>
                <p>Gestión interna de inventario</p>
            </div>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn-header">Ver Catálogo</a>
            <button id="btn-logout" class="btn-logout" style="display:none;">Salir</button>
        </div>
    </header>

    <div class="container">
        <div id="login-section" class="login-box">
            <h2 style="color: var(--primary); margin-top: 0;">Iniciar Sesión</h2>
            <input type="email" id="login-email" placeholder="Correo electrónico" required>
            <input type="password" id="login-pass" placeholder="Contraseña" required>
            <button id="btn-login">Ingresar</button>
            <p id="login-error" style="color: red; display: none; margin-top: 15px; font-size: 0.9em; font-weight: bold;"></p>
        </div>

        <div id="panel-admin">
            <!-- FORMULARIO DE PRODUCTOS -->
            <div class="admin-card" style="background: #fff8e1; border: 2px solid #ffb74d;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
                    <h2 style="color: #e65100; margin: 0; font-size: 1.3rem;">Agregar / Editar Producto</h2>
                    <a href="admin_tortas.html" style="background: linear-gradient(135deg, #ff9800, #e65100); color: white; text-decoration: none; padding: 9px 16px; border-radius: 10px; font-weight: bold; box-shadow: 0 3px 8px rgba(230,81,0,0.25);">Ir a Pastelería →</a>
                </div>

                <form id="form-producto" style="display: flex; flex-wrap: wrap; gap: 12px;">
                    <input type="text" id="prod-nombre" class="admin-input" placeholder="Nombre del producto (ej: Hallulla)" required>
                    <input type="text" id="prod-precio" class="admin-input" placeholder="Precio (escribe solo el número, ej: 1500)" required style="font-weight: bold; color: #e65100;">
                    <input type="text" id="prod-desc" class="admin-input" placeholder="Descripción breve" required>

                    <select id="prod-categoria" class="admin-input" required>
                        <option value="">Selecciona Categoría...</option>
                    </select>

                    <div style="flex: 1; min-width: 100%; background: white; padding: 15px; border-radius: 12px; border: 1.5px dashed #ffb74d; box-sizing: border-box;">
                        <p style="margin: 0 0 10px 0; font-size: 14px; color: #ef6c00; font-weight: bold;">Foto del producto:</p>
                        <div style="display: flex; flex-wrap: wrap; gap: 12px;">
                            <div style="flex: 1; min-width: 200px;">
                                <label style="font-size: 12px; color: #555; font-weight: 600; display: block; margin-bottom: 4px;">Opción 1: Tomar foto o Galería</label>
                                <input type="file" id="prod-img-file" accept="image/*" capture="environment" style="width: 100%; padding: 6px; font-size: 14px;">
                            </div>
                            <div style="flex: 1; min-width: 200px;">
                                <label style="font-size: 12px; color: #555; font-weight: 600; display: block; margin-bottom: 4px;">Opción 2: Pegar Link (URL)</label>
                                <input type="url" id="prod-img-url" placeholder="https://..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px;">
                            </div>
                        </div>
                        <div id="preview-container" class="img-preview-box">
                            <img id="preview-img" src="" alt="Vista previa">
                            <span id="preview-info" style="font-size: 13px; color: #2e7d32; font-weight: bold;">Imagen optimizada lista para subir</span>
                        </div>
                    </div>

                    <div style="display: flex; flex-wrap: wrap; gap: 10px; width: 100%; margin-top: 4px;">
                        <button id="btn-guardar-form" type="submit" style="flex: 2; min-width: 180px; background: linear-gradient(135deg, #ff9800, #ef6c00); color: white; border: none; padding: 13px 20px; cursor: pointer; font-weight: bold; border-radius: 10px; font-size: 16px; box-shadow: 0 4px 12px rgba(239,108,0,0.25);">Guardar Producto</button>
                        <button type="button" id="btn-cancelar-edicion" style="display: none; flex: 1; background: #757575; color: white; border: none; padding: 13px 20px; cursor: pointer; font-weight: bold; border-radius: 10px; font-size: 16px;">Cancelar Edición</button>
                    </div>
                </form>
            </div>

            <!-- GESTOR DE CATEGORÍAS -->
            <div class="admin-card" style="background: #e8f5e9; border: 2px solid #81c784;">
                <h2 style="color: #2e7d32; margin: 0 0 14px 0; font-size: 1.25rem;">Gestor de Categorías</h2>

                <form id="form-categoria" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px;">
                    <input type="hidden" id="cat-id-oculto" value="">
                    <input type="text" id="cat-nombre" class="admin-input" placeholder="Nueva categoría (ej: BEBIDAS)" required style="text-transform: uppercase;">

                    <button type="submit" id="btn-guardar-cat" style="background: #4caf50; color: white; border: none; padding: 12px 20px; cursor: pointer; font-weight: bold; border-radius: 10px; font-size: 15px;">+ Agregar Categoría</button>
                    <button type="button" id="btn-cancelar-cat" style="display: none; background: #757575; color: white; border: none; padding: 12px 20px; cursor: pointer; font-weight: bold; border-radius: 10px; font-size: 15px;">Cancelar</button>
                </form>

                <div style="background: white; padding: 14px; border-radius: 12px; border: 1px solid #c8e6c9;">
                    <h3 style="margin-top: 0; color: #333; font-size: 15px;">Categorías Actuales</h3>
                    <div id="lista-categorias-admin" style="display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; padding-right: 4px;">
                        <p style="color: #666; font-style: italic; margin: 0;">Cargando categorías...</p>
                    </div>
                </div>
            </div>

            <!-- HISTORIAL DE CAMBIOS -->
            <div class="admin-card" style="background: #e3f2fd; border: 2px solid #64b5f6;">
                <h2 style="color: #1565c0; margin: 0 0 10px 0; font-size: 1.2rem;">Historial de Cambios</h2>
                <div id="lista-historial" style="max-height: 180px; overflow-y: auto; background: white; padding: 14px; border-radius: 10px; border: 1px solid #bbdefb; font-family: monospace; font-size: 13px;">
                    Cargando historial...
                </div>
            </div>

            <!-- CONTENEDOR DE PRODUCTOS -->
            <div id="categorias-container"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfle8tRTuz_33Su2H8fTwjUywRN5VKU7Q",
            authDomain: "panaderia-belen.firebaseapp.com",
            projectId: "panaderia-belen",
            storageBucket: "panaderia-belen.firebasestorage.app",
            messagingSenderId: "982156401466",
            appId: "1:982156401466:web:4b8167ae3b676f8b3ece03"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        enableIndexedDbPersistence(db).catch((err) => { console.log("Caché local:", err.code); });

        const loginSection = document.getElementById('login-section');
        const panelAdmin = document.getElementById('panel-admin');
        const btnLogout = document.getElementById('btn-logout');

        const formulario = document.getElementById('form-producto');
        const inputPrecio = document.getElementById('prod-precio');
        const btnGuardarForm = document.getElementById('btn-guardar-form');
        const btnCancelarEdicion = document.getElementById('btn-cancelar-edicion');
        const inputImgFile = document.getElementById('prod-img-file');
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('preview-img');
        const previewInfo = document.getElementById('preview-info');

        let idProductoEditando = null;
        let urlImagenActual = "";
        let imagenComprimidaLista = null;

        const formCategoria = document.getElementById('form-categoria');
        const inputCatNombre = document.getElementById('cat-nombre');
        const idCatOculto = document.getElementById('cat-id-oculto');
        const btnGuardarCat = document.getElementById('btn-guardar-cat');
        const btnCancelarCat = document.getElementById('btn-cancelar-cat');
        const listaCategoriasAdmin = document.getElementById('lista-categorias-admin');
        const selectCategoria = document.getElementById('prod-categoria');
        const categoriasContainer = document.getElementById('categorias-container');

        // --- SÍMBOLO DE PRECIO AUTOMÁTICO ($) ---
        function asegurarSimboloPrecio(valor) {
            if (!valor) return "";
            const limpio = String(valor).replace(/^\$+/, '').trimStart();
            return limpio ? `$${limpio}` : "";
        }

        inputPrecio.addEventListener('input', (e) => {
            e.target.value = asegurarSimboloPrecio(e.target.value);
        });

        function obtenerUrlOptimizada(url, ancho = 400) {
            if (!url || typeof url !== 'string') return '';
            if (url.startsWith('data:') || !url.startsWith('http')) return url;
            return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=${ancho}&q=78&output=webp`;
        }

        function limpiarCacheCliente() {
            try {
                localStorage.removeItem("panaderia_belen_catalogo_v1");
                localStorage.removeItem("panaderia_belen_reposteria_v1");
            } catch (e) {}
        }

        // --- COMPRESIÓN ULTRARRÁPIDA EN NAVEGADOR ANTES DE SUBIR ---
        function comprimirImagen(fuente, maxDim = 800, calidad = 0.8) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', calidad);
                    const pureBase64 = dataUrl.split(',')[1];
                    resolve({ dataUrl, pureBase64, width, height });
                };
                img.onerror = (err) => reject(err);

                if (typeof fuente === 'string') {
                    img.src = fuente.startsWith('data:') ? fuente : `data:image/jpeg;base64,${fuente}`;
                } else {
                    const reader = new FileReader();
                    reader.onload = (e) => { img.src = e.target.result; };
                    reader.onerror = (err) => reject(err);
                    reader.readAsDataURL(fuente);
                }
            });
        }

        inputImgFile.addEventListener('change', async (e) => {
            const archivo = e.target.files[0];
            if (!archivo) {
                imagenComprimidaLista = null;
                previewContainer.style.display = 'none';
                return;
            }
            try {
                previewContainer.style.display = 'flex';
                previewInfo.textContent = 'Optimizando imagen...';
                const resultado = await comprimirImagen(archivo, 800, 0.8);
                imagenComprimidaLista = resultado.pureBase64;
                previewImg.src = resultado.dataUrl;
                const kb = Math.round((resultado.pureBase64.length * 3) / 4 / 1024);
                previewInfo.textContent = `Lista y optimizada (${kb} KB)`;
            } catch (err) {
                console.error("Error al comprimir:", err);
                imagenComprimidaLista = null;
            }
        });

        // --- AUTENTICACIÓN ---
        document.getElementById('btn-login').addEventListener('click', () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(() => {
                document.getElementById('login-error').innerText = "Error: Credenciales incorrectas.";
                document.getElementById('login-error').style.display = 'block';
            });
        });

        btnLogout.addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = 'none';
                panelAdmin.style.display = 'block';
                btnLogout.style.display = 'block';
                cargarCategorias();
                cargarHistorial();
            } else {
                loginSection.style.display = 'block';
                panelAdmin.style.display = 'none';
                btnLogout.style.display = 'none';
            }
        });

        // ==========================================
        // LÓGICA DEL GESTOR DE CATEGORÍAS (CRUD)
        // ==========================================
        let nombreCategoriaAntiguo = "";

        async function cargarCategorias() {
            const querySnapshot = await getDocs(collection(db, "categorias"));
            let categorias = [];
            querySnapshot.forEach(docSnap => {
                if (docSnap.data().nombre) {
                    categorias.push({ id: docSnap.id, nombre: docSnap.data().nombre.trim().toUpperCase() });
                }
            });

            categorias.sort((a, b) => a.nombre.localeCompare(b.nombre));

            listaCategoriasAdmin.innerHTML = '';
            selectCategoria.innerHTML = '<option value="">Selecciona Categoría...</option>';
            categoriasContainer.innerHTML = '';

            if (categorias.length === 0) {
                listaCategoriasAdmin.innerHTML = '<p style="color: #666; font-style: italic; margin: 0;">No hay categorías aún. ¡Agrega la primera arriba! (Ej: PAN)</p>';
            }

            categorias.forEach(cat => {
                const item = document.createElement('div');
                item.style = "display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f9f9f9; border: 1px solid #eee; border-radius: 8px;";
                item.innerHTML = `
                    <span style="font-weight: bold; color: #333;">${cat.nombre}</span>
                    <div style="display: flex; gap: 6px;">
                        <button class="btn-edit-cat" data-id="${cat.id}" data-nombre="${cat.nombre}" style="background: #2196F3; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Editar</button>
                        <button class="btn-del-cat" data-id="${cat.id}" data-nombre="${cat.nombre}" style="background: #f44336; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Borrar</button>
                    </div>
                `;
                listaCategoriasAdmin.appendChild(item);

                const option = document.createElement('option');
                option.value = cat.nombre;
                option.textContent = cat.nombre;
                selectCategoria.appendChild(option);

                const h2 = document.createElement('h2');
                h2.className = 'section-title';
                h2.textContent = cat.nombre;
                const divGrid = document.createElement('div');
                divGrid.className = 'product-grid';
                categoriasContainer.appendChild(h2);
                categoriasContainer.appendChild(divGrid);
            });

            document.querySelectorAll('.btn-edit-cat').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    idCatOculto.value = e.target.getAttribute('data-id');
                    nombreCategoriaAntiguo = e.target.getAttribute('data-nombre');
                    inputCatNombre.value = nombreCategoriaAntiguo;
                    btnGuardarCat.innerText = 'Actualizar Categoría';
                    btnGuardarCat.style.background = '#2196F3';
                    btnCancelarCat.style.display = 'block';
                    inputCatNombre.focus();
                });
            });

            document.querySelectorAll('.btn-del-cat').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const nombre = e.target.getAttribute('data-nombre');
                    if (confirm(`¿Seguro que deseas eliminar la categoría "${nombre}"?\n(Tus productos no se borrarán, pero dejarán de verse hasta que crees la categoría de nuevo).`)) {
                        await deleteDoc(doc(db, "categorias", id));
                        limpiarCacheCliente();
                        cargarCategorias();
                    }
                });
            });

            cargarProductosAdmin();
        }

        formCategoria.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombreCat = inputCatNombre.value.trim().toUpperCase();
            const idCat = idCatOculto.value;

            btnGuardarCat.disabled = true;
            btnGuardarCat.innerText = "Guardando...";

            try {
                if (idCat) {
                    await updateDoc(doc(db, "categorias", idCat), { nombre: nombreCat });
                    await registrarHistorial("EDITAR CAT.", nombreCat);

                    const productosSnap = await getDocs(collection(db, "productos"));
                    const promesasActualizacion = [];

                    productosSnap.forEach((docProd) => {
                        if (docProd.data().categoria === nombreCategoriaAntiguo) {
                            promesasActualizacion.push(updateDoc(doc(db, "productos", docProd.id), { categoria: nombreCat }));
                        }
                    });

                    await Promise.all(promesasActualizacion);
                } else {
                    await addDoc(collection(db, "categorias"), { nombre: nombreCat });
                    await registrarHistorial("AGREGAR CAT.", nombreCat);
                }

                limpiarCacheCliente();
                formCategoria.reset();
                idCatOculto.value = "";
                nombreCategoriaAntiguo = "";
                btnGuardarCat.innerText = "+ Agregar Categoría";
                btnGuardarCat.style.background = "#4caf50";
                btnCancelarCat.style.display = 'none';

                cargarCategorias();
            } catch (error) {
                console.error("Error:", error);
                alert("Error al guardar categoría.");
            } finally {
                btnGuardarCat.disabled = false;
            }
        });

        btnCancelarCat.addEventListener('click', () => {
            formCategoria.reset();
            idCatOculto.value = "";
            nombreCategoriaAntiguo = "";
            btnGuardarCat.innerText = "+ Agregar Categoría";
            btnGuardarCat.style.background = "#4caf50";
            btnCancelarCat.style.display = 'none';
        });

        // --- SISTEMA DE HISTORIAL (AUDITORÍA) ---
        async function registrarHistorial(accion, nombreProducto) {
            try {
                const usuario = auth.currentUser ? auth.currentUser.email : "Desconocido";
                const fecha = new Date().toLocaleString("es-CL");

                await addDoc(collection(db, "historial"), {
                    usuario: usuario,
                    accion: accion,
                    producto: nombreProducto,
                    fecha: fecha,
                    timestamp: Date.now()
                });
                cargarHistorial();
            } catch (error) {
                console.error("Error al registrar historial:", error);
            }
        }

        async function cargarHistorial() {
            const contenedor = document.getElementById('lista-historial');
            if (!contenedor) return;

            try {
                const querySnapshot = await getDocs(collection(db, "historial"));
                let registros = [];
                querySnapshot.forEach(doc => registros.push(doc.data()));

                registros.sort((a, b) => b.timestamp - a.timestamp);

                if (registros.length === 0) {
                    contenedor.innerHTML = 'No hay movimientos registrados aún.';
                    return;
                }

                contenedor.innerHTML = '';
                registros.forEach(reg => {
                    let color = reg.accion === "AGREGAR" ? "#2e7d32" : (reg.accion === "ELIMINAR" ? "#d32f2f" : "#ef6c00");
                    contenedor.innerHTML += `
                        <div style="border-bottom: 1px solid #eee; padding: 6px 0;">
                            <span style="color: #666;">[${reg.fecha}]</span> 
                            <strong>${reg.usuario}</strong>: 
                            <span style="color: ${color}; font-weight: bold;">${reg.accion}</span> 
                            <em>"${reg.producto}"</em>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar historial:", error);
            }
        }

        // --- SUBIDA IMGBB CON COMPRESIÓN ---
        async function subirFotoAImgBB(archivoOPureBase64) {
            let imagenParaSubir = archivoOPureBase64;

            if (archivoOPureBase64 instanceof File || (typeof archivoOPureBase64 === 'string' && archivoOPureBase64.length > 150000)) {
                try {
                    const comprimida = await comprimirImagen(archivoOPureBase64, 800, 0.8);
                    imagenParaSubir = comprimida.pureBase64;
                } catch (e) {}
            }

            const formData = new FormData();
            formData.append("image", imagenParaSubir);
            const apiKey = "dfe3b16bcee1c9785e2aef03245ec113";
            const url = `https://api.imgbb.com/1/upload?key=${apiKey}`;
            const respuesta = await fetch(url, { method: "POST", body: formData });
            const datos = await respuesta.json();
            return datos.data.display_url || datos.data.url;
        }

        // --- LÓGICA DE FORMULARIO ---
        function resetearFormulario() {
            formulario.reset();
            idProductoEditando = null;
            urlImagenActual = "";
            imagenComprimidaLista = null;
            previewContainer.style.display = 'none';
            btnGuardarForm.innerText = "Guardar Producto";
            btnGuardarForm.style.background = "linear-gradient(135deg, #ff9800, #ef6c00)";
            btnCancelarEdicion.style.display = 'none';
        }

        btnCancelarEdicion.addEventListener('click', resetearFormulario);

        formulario.addEventListener('submit', async (e) => {
            e.preventDefault();

            try { await auth.currentUser.reload(); } catch (error) {
                alert("Tu cuenta ha sido desactivada o eliminada.");
                signOut(auth); return;
            }

            btnGuardarForm.disabled = true;
            btnGuardarForm.innerText = "Subiendo imagen...";

            try {
                let urlImagenFinal = urlImagenActual;
                const archivoFoto = inputImgFile.files[0];
                const urlTexto = document.getElementById('prod-img-url').value.trim();

                if (imagenComprimidaLista) {
                    urlImagenFinal = await subirFotoAImgBB(imagenComprimidaLista);
                } else if (archivoFoto) {
                    urlImagenFinal = await subirFotoAImgBB(archivoFoto);
                } else if (urlTexto !== "") {
                    urlImagenFinal = urlTexto;
                } else if (!idProductoEditando) {
                    alert("Debes tomar una foto o pegar un link URL.");
                    btnGuardarForm.disabled = false;
                    btnGuardarForm.innerText = "Guardar Producto";
                    return;
                }

                btnGuardarForm.innerText = "Guardando producto...";

                const precioConSimbolo = asegurarSimboloPrecio(inputPrecio.value);

                const datosProducto = {
                    nombre: document.getElementById('prod-nombre').value.trim(),
                    precio: precioConSimbolo,
                    descripcion: document.getElementById('prod-desc').value.trim(),
                    imagen: urlImagenFinal,
                    categoria: document.getElementById('prod-categoria').value
                };

                if (idProductoEditando) {
                    await updateDoc(doc(db, "productos", idProductoEditando), datosProducto);
                    await registrarHistorial("EDITAR", datosProducto.nombre);
                } else {
                    await addDoc(collection(db, "productos"), datosProducto);
                    await registrarHistorial("AGREGAR", datosProducto.nombre);
                }

                limpiarCacheCliente();
                resetearFormulario();
                cargarProductosAdmin();
            } catch (error) {
                console.error(error);
                alert("Hubo un error al procesar.");
            } finally {
                btnGuardarForm.disabled = false;
                if (!idProductoEditando) {
                    btnGuardarForm.innerText = "Guardar Producto";
                }
            }
        });

        // --- CARGAR Y RENDERIZAR PRODUCTOS ---
        async function cargarProductosAdmin() {
            document.querySelectorAll('.product-grid').forEach(g => g.innerHTML = '');
            const querySnapshot = await getDocs(collection(db, "productos"));

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                if (!data.categoria) return;

                const titulos = document.querySelectorAll('.section-title');
                let contenedorGrilla = null;

                titulos.forEach(h2 => {
                    if (h2.innerText.trim().toUpperCase() === data.categoria.trim().toUpperCase()) {
                        contenedorGrilla = h2.nextElementSibling;
                    }
                });

                if (contenedorGrilla) {
                    const thumbUrl = obtenerUrlOptimizada(data.imagen, 400);
                    const precioMostrado = asegurarSimboloPrecio(data.precio);
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'product-card';
                    tarjeta.innerHTML = `
                        <img src="${thumbUrl}" data-original="${data.imagen}" alt="${data.nombre}" loading="lazy" decoding="async" onload="this.classList.add('loaded')" onerror="if(this.src !== this.dataset.original){this.src = this.dataset.original;}">
                        <div class="info">
                            <h3>${data.nombre}</h3>
                            <p class="price">${precioMostrado}</p>
                            <div style="display: flex; gap: 6px; margin-top: 10px; width: 100%;">
                                <button class="btn-editar" style="background: #2196F3; color: white; border: none; padding: 7px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold;">Editar</button>
                                <button class="btn-eliminar" style="background: #f44336; color: white; border: none; padding: 7px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold;">Borrar</button>
                            </div>
                        </div>
                    `;

                    tarjeta.querySelector('.btn-eliminar').addEventListener('click', async () => {
                        if (confirm(`¿Seguro que deseas eliminar "${data.nombre}"?`)) {
                            try { await auth.currentUser.reload(); } catch (error) {
                                alert("No tienes permiso.");
                                signOut(auth); return;
                            }
                            await deleteDoc(doc(db, "productos", docSnap.id));
                            limpiarCacheCliente();
                            await registrarHistorial("ELIMINAR", data.nombre);
                            cargarProductosAdmin();
                        }
                    });

                    tarjeta.querySelector('.btn-editar').addEventListener('click', () => {
                        document.getElementById('prod-nombre').value = data.nombre;
                        inputPrecio.value = asegurarSimboloPrecio(data.precio);
                        document.getElementById('prod-desc').value = data.descripcion || '';
                        document.getElementById('prod-categoria').value = data.categoria;

                        urlImagenActual = data.imagen;
                        inputImgFile.value = '';
                        imagenComprimidaLista = null;

                        if (data.imagen && data.imagen.startsWith('data:image')) {
                            document.getElementById('prod-img-url').value = '';
                        } else {
                            document.getElementById('prod-img-url').value = data.imagen || '';
                        }

                        if (data.imagen) {
                            previewContainer.style.display = 'flex';
                            previewImg.src = obtenerUrlOptimizada(data.imagen, 200);
                            previewInfo.textContent = 'Imagen actual del producto';
                        }

                        idProductoEditando = docSnap.id;
                        btnGuardarForm.innerText = "Actualizar Producto";
                        btnGuardarForm.style.background = "#2196F3";
                        btnCancelarEdicion.style.display = 'block';
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });

                    contenedorGrilla.prepend(tarjeta);
                }
            });
        }
    </script>
</body>
</html>
