<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Repostería - Panadería Belén</title>
    <link rel="preconnect" href="https://wsrv.nl" crossorigin>
    <link rel="preconnect" href="https://i.ibb.co" crossorigin>
    <link rel="dns-prefetch" href="https://i.ibb.co">
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

    <!-- Íconos para iPhone (iOS) y Android + PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="imagen/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="imagen/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="imagen/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Panadería Belén">
    <meta name="application-name" content="Panadería Belén">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ef6c00">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&text=Bel%C3%A9n&display=block" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="splash.js" data-sub="Preparando la vitrina de tortas"></script>
    <script src="header-escena.js" defer></script>
    <header>
        <div class="header-brand">
            <img src="imagen/apple-touch-icon.png" alt="Logo Belén" class="logo-header">
            <div class="header-text">
                <h1>Repostería Exclusiva</h1>
                <p>Tortas, Kuchen, Empanadas y Dulces</p>
            </div>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn-header">← Inicio</a>
        </div>
    </header>

    <div class="container">
        <div class="sticky-controls">
            <div class="search-wrapper">
                <input type="search" id="buscador-reposteria" class="search-input" placeholder="Buscar tortas, kuchen, empanadas...">
            </div>
            <div class="controles-extra">
                <span id="estado-precios" class="estado-precios" role="status">Revisando precios...</span>
                <button type="button" id="btn-vista" class="btn-vista" aria-pressed="false">
                    <svg class="icono-lista" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
                    <svg class="icono-fotos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
                    <span class="vista-label">Lista</span>
                </button>
            </div>
            <div id="filtros-categorias" class="category-chips"></div>
        </div>

        <div id="sin-resultados" class="empty-search-box" style="display: none;">
            <h3>No encontramos productos</h3>
            <p>Intenta con otro nombre o revisa otra categoría.</p>
        </div>

        <div id="reposteria-container">
            <h2 class="section-title" data-categoria="TORTAS">TORTAS</h2>
            <div class="product-grid" id="grid-tortas"></div>

            <h2 class="section-title" data-categoria="KUCHEN">KUCHEN</h2>
            <div class="product-grid" id="grid-kuchen"></div>

            <h2 class="section-title" data-categoria="EMPANADAS">EMPANADAS</h2>
            <div class="product-grid" id="grid-empanadas"></div>

            <h2 class="section-title" data-categoria="COSAS DULCES">COSAS DULCES</h2>
            <div class="product-grid" id="grid-cosas-dulces"></div>

            <h2 class="section-title" data-categoria="FRUTERIA">FRUTERIA</h2>
            <div class="product-grid" id="grid-fruteria"></div>
        </div>
    </div>

    <div id="offline-toast" class="offline-toast">Catálogo guardado en tu celular para carga rápida</div>

    <button type="button" id="btn-arriba" class="to-top" aria-label="Volver arriba">↑</button>

    <!-- MODAL PARA VER DETALLE DEL PRODUCTO -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" title="Cerrar">&times;</span>
            <img id="modalImg" src="" alt="">
            <div class="modal-details">
                <h2 id="modalName"></h2>
                <p id="modalDesc"></p>
                <div id="modalPrice" class="modal-price"></div>
                <p id="modalFecha" class="modal-fecha"></p>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById("productModal");
        const closeBtn = document.querySelector(".close-btn");

        // Cierra el modal con animación de salida
        function cerrarModal() {
            if (modal.style.display !== "flex" || modal.classList.contains("closing")) return;
            modal.classList.add("closing");
            setTimeout(() => {
                modal.style.display = "none";
                modal.classList.remove("closing");
            }, 220);
        }

        closeBtn.onclick = cerrarModal;
        window.onclick = (e) => { if (e.target === modal) cerrarModal(); };
        window.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarModal(); });

        // Sombra en la barra de búsqueda al hacer scroll + botón "volver arriba"
        const barraFija = document.querySelector(".sticky-controls");
        const btnArriba = document.getElementById("btn-arriba");
        function alHacerScroll() {
            const y = window.scrollY;
            if (barraFija) barraFija.classList.toggle("stuck", barraFija.getBoundingClientRect().top <= 0 && y > 50);
            if (btnArriba) btnArriba.classList.toggle("show", y > 500);
        }
        window.addEventListener("scroll", alHacerScroll, { passive: true });
        if (btnArriba) btnArriba.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => console.log('SW:', err));
            });
        }
    </script>

    <script src="utilidades.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, getDocs, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfle8tRTuz_33Su2H8fTwjUywRN5VKU7Q",
            authDomain: "panaderia-belen.firebaseapp.com",
            projectId: "panaderia-belen",
            storageBucket: "panaderia-belen.firebasestorage.app",
            messagingSenderId: "982156401466",
            appId: "1:982156401466:web:4b8167ae3b676f8b3ece03"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        enableIndexedDbPersistence(db).catch((err) => { console.log("Caché local:", err.code); });

        const B = window.Belen;
        const estadoPrecios = B.crearEstadoPrecios(document.getElementById('estado-precios'));
        B.iniciarSelectorVista(document.getElementById('btn-vista'), document.getElementById('reposteria-container'));

        // Vista de lista: cada categoría se pliega/despliega al tocar su título
        const categoriasAbiertas = new Set();
        document.getElementById('reposteria-container').addEventListener('click', (e) => {
            const titulo = e.target.closest('.section-title');
            if (!titulo) return;
            const cat = titulo.dataset.categoria;
            if (titulo.classList.toggle('abierta')) categoriasAbiertas.add(cat);
            else categoriasAbiertas.delete(cat);
        });
        document.querySelectorAll('#reposteria-container .section-title').forEach(t => {
            t.innerHTML = `<span class="titulo-cat">${t.textContent}</span><span class="cuenta-cat"></span>`;
        });

        let categoriaActiva = "TODAS";
        let productosActuales = [];
        const CACHE_KEY = "panaderia_belen_reposteria_v1";
        const categoriasValidas = ["TORTAS", "KUCHEN", "EMPANADAS", "COSAS DULCES", "FRUTERIA"];

        const mapaGrillas = {
            "TORTAS": "grid-tortas",
            "KUCHEN": "grid-kuchen",
            "EMPANADAS": "grid-empanadas",
            "COSAS DULCES": "grid-cosas-dulces",
            "FRUTERIA": "grid-fruteria"
        };

        const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // Anima las tarjetas de cada carrusel cuando aparece en pantalla
        let yaSeMostroCatalogo = false;
        const observadorGrillas = ('IntersectionObserver' in window)
            ? new IntersectionObserver((entradas) => {
                entradas.forEach(e => {
                    if (e.isIntersecting) {
                        e.target.classList.add('in-view');
                        observadorGrillas.unobserve(e.target);
                    }
                });
            }, { rootMargin: '0px 0px -40px 0px' })
            : null;

        function prepararAnimacion(grilla) {
            grilla.classList.add('reveal');
            grilla.querySelectorAll('.product-card').forEach((tarjeta, i) => {
                tarjeta.style.setProperty('--i', Math.min(i, 8));
                if (yaSeMostroCatalogo) tarjeta.classList.add('no-anim');
            });
            if (observadorGrillas && !yaSeMostroCatalogo) {
                observadorGrillas.observe(grilla);
            } else {
                grilla.classList.add('in-view');
            }
        }

        function obtenerUrlOptimizada(url, ancho = 400) {
            if (!url || typeof url !== 'string') return '';
            if (url.startsWith('data:') || !url.startsWith('http')) return url;
            return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=${ancho}&q=78&output=webp`;
        }

        function guardarFotosEnCelular(productos) {
            if (!('serviceWorker' in navigator)) return;
            const urls = productos
                .map(p => obtenerUrlOptimizada(p.imagen, 400))
                .filter(Boolean);

            navigator.serviceWorker.ready.then((reg) => {
                if (reg.active) {
                    reg.active.postMessage({ type: 'CACHE_IMAGES', urls });
                }
            });
        }

        // Detalle del producto con fecha del último cambio de precio
        function abrirDetalle(data) {
            const modalImgEl = document.getElementById("modalImg");
            modalImgEl.onerror = function() {
                if (this.src !== data.imagen) this.src = data.imagen;
            };
            modalImgEl.src = obtenerUrlOptimizada(data.imagen, 800);
            modalImgEl.alt = data.nombre;
            document.getElementById("modalName").innerText = data.nombre;
            document.getElementById("modalDesc").innerText = data.descripcion || '';
            document.getElementById("modalPrice").innerText = B.formatearPrecio(data.precio);

            const fecha = document.getElementById("modalFecha");
            if (data.precioActualizadoEn) {
                fecha.textContent = `Precio actualizado el ${B.fechaCorta(data.precioActualizadoEn)}`;
                fecha.classList.toggle('nuevo', B.esPrecioNuevo(data.precioActualizadoEn));
            } else {
                fecha.textContent = '';
            }

            document.getElementById("productModal").style.display = "flex";
        }

        function crearTarjeta(data, catUpper, index) {
            const precioFormateado = B.formatearPrecio(data.precio);
            const tarjeta = document.createElement('div');
            const agotado = !data.stock || Number(data.stock) <= 0;
            tarjeta.className = 'product-card' + (agotado ? ' is-agotado' : '');
            tarjeta.dataset.nombre = data.nombre || '';
            tarjeta.dataset.buscar = `${data.nombre || ''} ${catUpper}`;

            const textoStock = agotado
                ? `<p class="stock-badge agotado">Agotado</p>`
                : `<p class="stock-badge">Stock: ${esc(data.stock)}</p>`;

            const esPrioritaria = index < 6;
            const loadingAttr = esPrioritaria ? 'eager' : 'lazy';
            const priorityAttr = esPrioritaria ? 'fetchpriority="high"' : '';
            const thumbUrl = obtenerUrlOptimizada(data.imagen, 400);
            const nuevo = B.esPrecioNuevo(data.precioActualizadoEn)
                ? `<span class="badge-precio-nuevo" title="Cambió el ${B.fechaCorta(data.precioActualizadoEn)}">Precio nuevo</span>`
                : '';

            tarjeta.innerHTML = `
                <div class="card-img-wrap">
                    <img src="${thumbUrl}" data-original="${esc(data.imagen)}" alt="${esc(data.nombre)}" loading="${loadingAttr}" ${priorityAttr} decoding="async" onload="this.classList.add('loaded')" onerror="if(this.src !== this.dataset.original){this.src = this.dataset.original;}">
                    ${agotado ? '<span class="ribbon-agotado">AGOTADO</span>' : ''}
                    <span class="card-hover-hint">Ver detalle</span>
                </div>
                <div class="info">
                    <div class="card-meta"><span class="card-cat-tag">${esc(catUpper)}</span>${nuevo}</div>
                    <h3>${esc(data.nombre)}</h3>
                    <p class="price">${esc(precioFormateado)}</p>
                    ${textoStock}
                </div>
            `;

            tarjeta.addEventListener('click', () => abrirDetalle(data));
            return tarjeta;
        }

        function renderizarReposteria(productos) {
            const filtrosContainer = document.getElementById('filtros-categorias');
            productosActuales = productos;

            Object.values(mapaGrillas).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = '';
            });

            window.ocultarSplash();

            productos.forEach((data, index) => {
                const catUpper = (data.categoria || '').trim().toUpperCase();
                const idGrilla = mapaGrillas[catUpper];
                const contenedorGrilla = idGrilla ? document.getElementById(idGrilla) : null;
                if (contenedorGrilla) contenedorGrilla.appendChild(crearTarjeta(data, catUpper, index));
            });

            document.querySelectorAll('#reposteria-container .product-grid').forEach(grilla => {
                B.ordenarTarjetas(grilla);
                prepararAnimacion(grilla);
            });
            if (productos.length > 0) yaSeMostroCatalogo = true;

            if (filtrosContainer) {
                filtrosContainer.innerHTML = '';
                const categoriasConProductos = categoriasValidas.filter(catNombre => {
                    const grilla = document.getElementById(mapaGrillas[catNombre]);
                    return grilla && grilla.children.length > 0;
                });

                if (categoriasConProductos.length > 1) {
                    const chipTodas = document.createElement('button');
                    chipTodas.className = 'chip' + (categoriaActiva === 'TODAS' ? ' active' : '');
                    chipTodas.textContent = 'Todas';
                    chipTodas.onclick = () => seleccionarCategoria('TODAS', chipTodas);
                    filtrosContainer.appendChild(chipTodas);

                    categoriasConProductos.forEach(catNombre => {
                        const chip = document.createElement('button');
                        chip.className = 'chip' + (categoriaActiva === catNombre ? ' active' : '');
                        chip.textContent = catNombre;
                        chip.onclick = () => seleccionarCategoria(catNombre, chip);
                        filtrosContainer.appendChild(chip);
                    });
                }
            }

            aplicarFiltros();
        }

        async function cargarReposteria() {
            // 1. Renderizado instantáneo desde caché local
            try {
                const cacheGuardado = localStorage.getItem(CACHE_KEY);
                if (cacheGuardado) {
                    renderizarReposteria(JSON.parse(cacheGuardado));
                }
            } catch (e) {}

            // 2. Actualización desde Firebase
            try {
                const querySnapshot = await getDocs(collection(db, "productos"));
                let productosReposteria = [];

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const catUpper = (data.categoria || '').trim().toUpperCase();
                    if (categoriasValidas.includes(catUpper)) {
                        productosReposteria.push({ id: docSnap.id, ...data });
                    }
                });

                renderizarReposteria(productosReposteria);
                guardarFotosEnCelular(productosReposteria);

                // Si Firebase respondió desde la memoria del celular, no hay conexión
                if (querySnapshot.metadata && querySnapshot.metadata.fromCache) estadoPrecios.sinConexion();
                else estadoPrecios.actualizado();

                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(productosReposteria));
                } catch (e) {}

            } catch (error) {
                console.error("Error al cargar repostería: ", error);
                estadoPrecios.sinConexion();
                if (productosActuales.length) window.ocultarSplash();
                else window.mostrarErrorSplash('Hubo un error al cargar la vitrina. Revisa tu conexión.');
            }
        }

        function seleccionarCategoria(catNombre, botonChip) {
            categoriaActiva = catNombre;
            document.querySelectorAll('.category-chips .chip').forEach(c => c.classList.remove('active'));
            if (botonChip) {
                botonChip.classList.add('active');
                botonChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
            // Al elegir una categoría, en la vista de lista se despliega sola
            if (catNombre !== 'TODAS') {
                categoriasAbiertas.add(catNombre);
                document.querySelectorAll('#reposteria-container .section-title').forEach(t => {
                    if (t.dataset.categoria === catNombre) t.classList.add('abierta');
                });
            }
            aplicarFiltros();

            // Pequeña transición al cambiar de categoría
            const contenedor = document.getElementById('reposteria-container');
            if (contenedor) {
                contenedor.classList.remove('swap-anim');
                void contenedor.offsetWidth;
                contenedor.classList.add('swap-anim');
            }
        }

        function aplicarFiltros() {
            const buscador = document.getElementById('buscador-reposteria');
            const consulta = buscador ? buscador.value : "";
            const buscando = B.normalizar(consulta) !== "";
            const sinResultados = document.getElementById('sin-resultados');
            const reposteriaContainer = document.getElementById('reposteria-container');
            let totalVisibles = 0;

            if (reposteriaContainer) reposteriaContainer.classList.toggle('modo-busqueda', buscando);

            document.querySelectorAll('#reposteria-container .section-title').forEach(titulo => {
                const catTitulo = titulo.dataset.categoria;
                const grilla = titulo.nextElementSibling;
                if (!grilla || !grilla.classList.contains('product-grid')) return;

                const coincideCategoria = buscando || categoriaActiva === "TODAS" || categoriaActiva === catTitulo;
                let visiblesEnGrilla = 0;

                grilla.querySelectorAll('.product-card').forEach(tarjeta => {
                    // Búsqueda tolerante: acepta errores de tipeo y palabras en cualquier orden
                    const visible = coincideCategoria && B.coincide(tarjeta.dataset.buscar, consulta);
                    tarjeta.style.display = visible ? '' : 'none';
                    if (visible) { visiblesEnGrilla++; totalVisibles++; }
                });

                const cuenta = titulo.querySelector('.cuenta-cat');
                if (cuenta) cuenta.textContent = visiblesEnGrilla;
                titulo.style.display = (visiblesEnGrilla > 0 && !buscando) ? '' : 'none';
                grilla.style.display = visiblesEnGrilla > 0 ? '' : 'none';
            });

            if (sinResultados) {
                sinResultados.style.display = (totalVisibles === 0) ? 'block' : 'none';
            }
        }

        cargarReposteria();

        const buscador = document.getElementById('buscador-reposteria');
        if (buscador) {
            buscador.addEventListener('input', aplicarFiltros);
        }
    </script>
</body>
</html>
