<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="imagen/logo.jpg">
    <link rel="apple-touch-icon" href="imagen/logo.jpg">
    <link rel="icon" sizes="192x192" href="imagen/logo.jpg">
    <link rel="icon" sizes="512x512" href="imagen/logo.jpg">
    <meta name="apple-mobile-web-app-title" content="Panadería Belén">
    <meta name="application-name" content="Panadería Belén">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ef6c00">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="imagen/logo.jpg" alt="Logo Belén" class="logo-header">
        <div class="header-text">
            <h1>Panadería Belén</h1>
            <p>Desliza para ver nuestros productos</p>
        </div>
        
        <a href="admin.html" style="margin-left: auto; background: white; color: var(--primary); text-decoration: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; transition: 0.3s; border: 2px solid white;">Iniciar Sesión</a>
    </header>

    <div class="container">
        <div class="container">
            <div style="margin: 25px 0 25px 0; text-align: center;">
            <input type="text" id="buscador-productos" placeholder=" Buscar pan, bebidas, dulces..." style="width: 100%; max-width: 500px; padding: 14px 20px; border: 2px solid #ef6c00; border-radius: 25px; font-size: 16px; outline: none; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: 0.3s;">
        </div>
            <div id="pantalla-carga" style="text-align: center; padding: 50px 20px; color: #ef6c00;">
            <h2 style="font-size: 24px; margin-bottom: 10px;"> Horneando el menú...</h2>
            <p style="color: #666; font-weight: bold;">Descargando catálogo, por favor espera unos segundos.</p>
        </div>

        <div style="text-align: center; margin-bottom: 30px;">            <a href="tortas.html" style="display: block; background: linear-gradient(135deg, #ff9800, #e65c00); color: white; padding: 15px 20px; border-radius: 10px; text-decoration: none; font-size: 1.2rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                 Ver Catálogo de pasteleria
            </a>
        </div>
        <div id="categorias-container"></div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <img id="modalImg" src="" alt="">
            <div class="modal-details">
                <h2 id="modalName"></h2>
                <p id="modalDesc"></p>
                <div id="modalPrice" class="modal-price"></div>
            </div>
        </div>
    </div>

    <script>
        // Lógica para cerrar el modal interactivo
        const modal = document.getElementById("productModal");
        const closeBtn = document.querySelector(".close-btn");

        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
      import { getFirestore, collection, getDocs, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAfle8tRTuz_33Su2H8fTwjUywRN5VKU7Q",
        authDomain: "panaderia-belen.firebaseapp.com",
        projectId: "panaderia-belen",
        storageBucket: "panaderia-belen.firebasestorage.app",
        messagingSenderId: "982156401466",
        appId: "1:982156401466:web:4b8167ae3b676f8b3ece03"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // ACTIVAMOS LA CACHÉ
      enableIndexedDbPersistence(db).catch((err) => { console.log("Caché local:", err.code); });

      // FUNCIÓN PARA LEER CATEGORÍAS Y PRODUCTOS DINÁMICAMENTE (CON FILTRO DE PASTELERÍA)
      async function cargarCategoriasYProductos() {
          const pantallaCarga = document.getElementById('pantalla-carga');
          const categoriasContainer = document.getElementById('categorias-container');
          
          // 💡 EL FILTRO: Lista de categorías que NO queremos que salgan en el inicio
          const categoriasExcluidas = ["TORTAS", "KUCHEN", "EMPANADAS", "COSAS DULCES"];

          try {
              // 1. Descargamos TODOS los productos primero
              const prodSnapshot = await getDocs(collection(db, "productos"));
              let productos = [];
              let categoriasUnicas = new Set();

              prodSnapshot.forEach((docSnap) => {
                  const data = docSnap.data();
                  if (data.categoria) {
                      const catUpper = data.categoria.trim().toUpperCase();
                      
                      // Solo lo guardamos si NO está en la lista de excluidas
                      if (!categoriasExcluidas.includes(catUpper)) {
                          productos.push(data);
                          categoriasUnicas.add(catUpper);
                      }
                  }
              });

              // 2. También descargamos las categorías oficiales del admin
              const catSnapshot = await getDocs(collection(db, "categorias"));
              catSnapshot.forEach(doc => {
                  const catUpper = doc.data().nombre.trim().toUpperCase();
                  // Solo la agregamos si NO es de pastelería
                  if (!categoriasExcluidas.includes(catUpper)) {
                      categoriasUnicas.add(catUpper);
                  }
              });
              
              // Convertimos a lista y ordenamos alfabéticamente
              let categorias = Array.from(categoriasUnicas).sort();
              
              // 3. Limpiamos y creamos los contenedores visuales
              if(categoriasContainer) categoriasContainer.innerHTML = '';
              categorias.forEach(catNombre => {
                  const h2 = document.createElement('h2');
                  h2.className = 'section-title';
                  h2.textContent = catNombre;
                  
                  const divGrid = document.createElement('div');
                  divGrid.className = 'product-grid';
                  divGrid.id = 'grid-' + catNombre.replace(/\s+/g, '-'); 
                  
                  if(categoriasContainer) {
                      categoriasContainer.appendChild(h2);
                      categoriasContainer.appendChild(divGrid);
                  }
              });

              if (pantallaCarga) pantallaCarga.style.display = 'none';
              
              // 4. Repartimos los productos en sus respectivas cajas
              productos.forEach((data) => {
                  const idGrilla = 'grid-' + data.categoria.trim().toUpperCase().replace(/\s+/g, '-');
                  const contenedorGrilla = document.getElementById(idGrilla);

                  if(contenedorGrilla) {
                      const tarjeta = document.createElement('div');
                      tarjeta.className = 'product-card';
                      tarjeta.innerHTML = `
                          <img src="${data.imagen}" alt="${data.nombre}" loading="lazy">
                          <div class="info">
                              <h3>${data.nombre}</h3>
                              <p class="price">${data.precio}</p>
                          </div>
                      `;

                      tarjeta.addEventListener('click', () => {
                          document.getElementById("modalImg").src = data.imagen;
                          document.getElementById("modalName").innerText = data.nombre;
                          document.getElementById("modalDesc").innerText = data.descripcion || '';
                          document.getElementById("modalPrice").innerText = data.precio;
                          document.getElementById("productModal").style.display = "flex";
                      });

                      contenedorGrilla.prepend(tarjeta);
                  }
              });

              // 5. Ocultar categorías vacías
              document.querySelectorAll('.section-title').forEach(titulo => {
                  const grilla = titulo.nextElementSibling;
                  if (grilla && grilla.children.length === 0) {
                      titulo.style.display = 'none';
                      grilla.style.display = 'none';
                  }
              });

          } catch (error) {
              console.error("Error al cargar los datos: ", error);
              if (pantallaCarga) pantallaCarga.innerHTML = '<p style="color:red; font-weight:bold;">Hubo un error al cargar.</p>';
          }
      }

      cargarCategoriasYProductos();
      
      // --- BUSCADOR EN TIEMPO REAL ---
      const buscador = document.getElementById('buscador-productos');
      if (buscador) {
          buscador.addEventListener('input', (e) => {
              const textoBuscado = e.target.value.toLowerCase().trim();
              const todasLasTarjetas = document.querySelectorAll('.product-card');

              todasLasTarjetas.forEach(tarjeta => {
                  const nombreProducto = tarjeta.querySelector('h3').innerText.toLowerCase();
                  if (nombreProducto.includes(textoBuscado)) {
                      tarjeta.style.display = '';
                  } else {
                      tarjeta.style.display = 'none';
                  }
              });

              // Ocultar títulos Y grillas vacías para evitar espacios gigantes
              document.querySelectorAll('.section-title').forEach(titulo => {
                  const grilla = titulo.nextElementSibling;
                  if (grilla && grilla.classList.contains('product-grid')) {
                      const tarjetasVisibles = grilla.querySelectorAll('.product-card:not([style*="display: none"])');
                      
                      if (tarjetasVisibles.length === 0 && textoBuscado !== "") {
                          titulo.style.display = 'none';
                          grilla.style.display = 'none'; // <-- ¡ESTO QUITA EL ESPACIO VACÍO!
                      } else {
                          titulo.style.display = '';
                          grilla.style.display = '';
                      }
                  }
              });
          });
      }
    </script>
</body>
</html>
