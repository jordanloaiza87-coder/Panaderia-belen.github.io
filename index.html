<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panadería Belén - Catálogo Deslizable</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <img src="imagen/logo.jpg" alt="Logo Belén" class="logo-header">
    
    <div class="header-text">
        <h1>Panadería Belén</h1>
        <p>Desliza para ver nuestros productos</p>
    </div>
</header>
    <div class="container">

        <h2 class="section-title">PAN</h2>
        <div class="product-grid">
            <div class="product-card" data-name="Marraqueta" data-price="$1.700 / kg" data-desc="Pan crujiente recién salido del horno de barro." data-img="https://images.unsplash.com/photo-1598373182133-52452f7691ef?q=80&w=600">
                <img src="https://images.unsplash.com/photo-1598373182133-52452f7691ef?q=80&w=600" alt="Marraqueta">
                <div class="info">
                    <h3>Marraqueta</h3>
                    <p class="price">$1.700 / kg</p>
                </div>
            </div>
            <div class="product-card" data-name="Hallulla" data-price="$1.700 / kg" data-desc="Tradicional pan de miga suave." data-img="https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=600">
                <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=600" alt="Hallulla">
                <div class="info">
                    <h3>Hallulla</h3>
                    <p class="price">$1.700 / kg</p>
                </div>
            </div>
            <div class="product-card" data-name="Pan Amasado" data-price="$600 c/u" data-desc="Hecho con amor y mucha manteca." data-img="https://images.unsplash.com/photo-1549931319-a545dcf3bc73?q=80&w=600">
                <img src="https://images.unsplash.com/photo-1549931319-a545dcf3bc73?q=80&w=600" alt="Pan Amasado">
                <div class="info">
                    <h3>Pan Amasado</h3>
                    <p class="price">$600 c/u</p>
                </div>
            </div>
        </div>

        <h2 class="section-title">BEBIDAS</h2>
        <div class="product-grid">
            
            
        </div>
        <h2 class="section-title">DULCES</h2>
        <div class="product-grid">
            
        </div>

    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <img id="modalImg" src="" alt="">
            <div class="modal-details">
                <h2 id="modalName"></h2>
                <p id="modalDesc"></p>
                <div id="modalPrice" class="modal-price"></div>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById("productModal");
        const cards = document.querySelectorAll(".product-card");
        const closeBtn = document.querySelector(".close-btn");

        cards.forEach(card => {
            card.addEventListener("click", () => {
                document.getElementById("modalImg").src = card.getAttribute("data-img");
                document.getElementById("modalName").innerText = card.getAttribute("data-name");
                document.getElementById("modalDesc").innerText = card.getAttribute("data-desc");
                document.getElementById("modalPrice").innerText = card.getAttribute("data-price");
                modal.style.display = "flex";
            });
        });

        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }
    </script>
</body>
</html>
